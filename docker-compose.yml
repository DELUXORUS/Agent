services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agent_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: agent_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: agent_rabbitmq
    restart: always
    ports:
      - "5672:5672"   # AMQP порт для приложения
      - "15672:15672" # Веб-панель RabbitMQ Management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent_api
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - OMP_NUM_THREADS=2 # Ограничение потоков CPU для ONNX
    env_file:
      - .env
    volumes:
      - .:/app
      - fastembed_cache:/root/.cache/fastembed # Кэш ONNX моделей FastEmbed
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  handler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent_handler # Раскомментировали имя
    restart: always
    command: python -m app.handler.handler
    environment:
      - OMP_NUM_THREADS=2 # Ограничение потоков CPU для ONNX
    env_file:
      - .env
    volumes:
      - .:/app
      - fastembed_cache:/root/.cache/fastembed # Общий кэш моделей
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  ngrok:
    image: ngrok/ngrok:latest
    container_name: agent_ngrok
    restart: unless-stopped
    command:
      - "http"
      - "--url=${NGROK_DOMAIN}"
      - "api:8000"
    environment:
      NGROK_AUTHTOKEN: "${NGROK_AUTHTOKEN}"
    depends_on:
      - api

volumes:
  pgdata:
  fastembed_cache: # Именованный volume для кэша FastEmbed